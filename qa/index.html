<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Бесплатный мини-курс о старте в IT и профессии тестировщика."
    />
    <link rel="canonical" href="https://honeymontana.com/qa/" />
    <link rel="icon" href="/favicon.png" />
    <title>Бесплатный мини-курс о старте в IT</title>
    <script>
      (() => {
        const experimentKey = "hm_qa_landing_01";
        const parameters = new URLSearchParams(window.location.search);
        const forcedVariant = (parameters.get("ab") || "").toLowerCase();
        let variant = forcedVariant === "a" || forcedVariant === "b" ? forcedVariant : null;

        if (!variant) {
          try {
            const savedVariant = window.localStorage.getItem(experimentKey);
            if (savedVariant === "a" || savedVariant === "b") {
              variant = savedVariant;
            }
          } catch {
            // A cookie below keeps the assignment stable when localStorage is unavailable.
          }
        }

        if (!variant) {
          const cookiePrefix = `${experimentKey}=`;
          const savedCookie = document.cookie
            .split(";")
            .map((part) => part.trim())
            .find((part) => part.startsWith(cookiePrefix));
          const cookieVariant = savedCookie?.slice(cookiePrefix.length);

          if (cookieVariant === "a" || cookieVariant === "b") {
            variant = cookieVariant;
          }
        }

        if (!variant) {
          if (window.crypto && typeof window.crypto.getRandomValues === "function") {
            const randomValue = new Uint32Array(1);
            window.crypto.getRandomValues(randomValue);
            variant = randomValue[0] < 0x80000000 ? "a" : "b";
          } else {
            variant = Math.random() < 0.5 ? "a" : "b";
          }

          try {
            window.localStorage.setItem(experimentKey, variant);
          } catch {
            // The cookie is enough when localStorage is blocked.
          }

          const secure = window.location.protocol === "https:" ? "; Secure" : "";
          document.cookie = `${experimentKey}=${variant}; Max-Age=7776000; Path=/; SameSite=Lax${secure}`;
        }

        parameters.delete("ab");

        const destination = new URL(`./${variant}/`, window.location.href);
        destination.search = parameters.toString();
        destination.hash = window.location.hash;
        window.location.replace(destination.href);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #040405;
        color: #f4f4f5;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }

      a {
        color: #05ff72;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Открываем бесплатный мини-курс…</p>
      <noscript>
        Для выбора версии нужен JavaScript. <a href="./a/">Открыть курс</a>.
      </noscript>
    </main>
  </body>
</html>
